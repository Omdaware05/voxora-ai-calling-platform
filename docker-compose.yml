# Voxora — Enterprise AI Voice Calling Platform
# Production compose stack: Postgres + Redis + MinIO + Backend + Frontend.

name: voxora

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxora}
      POSTGRES_DB: ${POSTGRES_DB:-voxora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-voxora} -d $${POSTGRES_DB:-voxora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voxoraadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voxoraadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-voxora}:${POSTGRES_PASSWORD:-voxora}@postgres:5432/${POSTGRES_DB:-voxora}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/code/data

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
